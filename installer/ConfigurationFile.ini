;Wybix POS - Instalacion desatendida de SQL Server Express
;La contrasena de 'sa' (SAPWD) se pasa por linea de comandos, no aqui.
[OPTIONS]
ACTION="Install"
IACCEPTSQLSERVERLICENSETERMS="True"
FEATURES=SQLENGINE
INSTANCENAME="SQLEXPRESS"
INSTANCEID="SQLEXPRESS"
SQLSVCACCOUNT="NT AUTHORITY\SYSTEM"
SQLSVCSTARTUPTYPE="Automatic"
SECURITYMODE="SQL"
SQLSYSADMINACCOUNTS="BUILTIN\Administrators"
TCPENABLED="1"
NPENABLED="1"
BROWSERSVCSTARTUPTYPE="Automatic"
QUIETSIMPLE="True"
UpdateEnabled="False"
