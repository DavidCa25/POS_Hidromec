<nav class="wxside" [class.es-plegada]="plegada()" aria-label="Navegación de Wybix">

  <!-- Cabecera: la del rail, con el logo sobre su baldosa blanca. -->
  <div class="wxside__cab">
    <img src="assets/wybie_logo.png" alt="" class="wxside__logo" *ngIf="!plegada()" />
    <span class="wxside__titulo" *ngIf="!plegada()">Wybix POS</span>
    <button type="button" class="wxside__plegar" (click)="alternarPlegada()"
            [attr.aria-label]="plegada() ? 'Desplegar menú' : 'Plegar menú'"
            [attr.title]="plegada() ? 'Desplegar menú' : 'Plegar menú'"
            [attr.aria-expanded]="!plegada()">
      <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Ctrl+K, el mismo buscador que la lupa del dock. -->
  <button type="button" class="wxside__buscar" data-guide="buscar" (click)="buscar()"
          aria-label="Buscar en Wybix" [attr.title]="plegada() ? 'Buscar en Wybix (Ctrl K)' : null">
    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
    <span class="wxside__buscartxt">Buscar</span>
    <kbd class="wxside__kbd">Ctrl K</kbd>
  </button>

  <!-- Las acciones del dia, las mismas que el dock (NavAccionesService). -->
  <button type="button" class="wxside__accion" data-guide="nav-checar" *ngIf="acc.verChecar()" (click)="acc.abrirChecar()"
          aria-haspopup="dialog" aria-label="Checar" [attr.title]="plegada() ? 'Checar' : null">
    <i class="ph ph-clock" aria-hidden="true"></i><span class="wxside__txt">Checar</span>
  </button>

  <ul class="wxside__menu">
    <!-- ------------------------------------------------------------ areas -->
    <li *ngFor="let a of areas(); trackBy: porId" class="wxside__area" [class.is-open]="estaAbierto(a)">

      <!-- Un area con un solo destino es un ENLACE: lleva a un sitio. -->
      <a *ngIf="!tienePanel(a); else grupo" class="wxside__link" [attr.data-guide]="'area-' + a.id"
         [class.active]="esActiva(a)" [attr.aria-current]="esActiva(a) ? 'page' : null"
         [routerLink]="a.ruta" [attr.title]="plegada() ? a.nombre : null">
        <i class="ph {{ a.icono }}" aria-hidden="true"></i>
        <span class="wxside__txt">{{ a.nombre }}</span>
        <span *ngIf="a.aviso && a.aviso.tono !== 'ok'" class="wxside__punto"
              [ngClass]="'es-' + a.aviso.tono" [attr.title]="a.aviso.texto"></span>
      </a>

      <!-- Con varios, un GRUPO que se despliega en su sitio. -->
      <ng-template #grupo>
        <button type="button" class="wxside__link" [attr.data-guide]="'area-' + a.id" [class.active]="esActiva(a)"
                (click)="alternarGrupo(a)"
                [attr.aria-expanded]="estaAbierto(a)" [attr.aria-controls]="'wxside-' + a.id"
                [attr.title]="plegada() ? a.nombre : null">
          <i class="ph {{ a.icono }}" aria-hidden="true"></i>
          <span class="wxside__txt">{{ a.nombre }}</span>
          <span *ngIf="a.aviso && a.aviso.tono !== 'ok'" class="wxside__punto"
                [ngClass]="'es-' + a.aviso.tono" [attr.title]="a.aviso.texto"></span>
          <i class="ph ph-caret-down wxside__chevron" aria-hidden="true"></i>
        </button>

        <div class="wx-abrir wxside__sub" [class.es-cerrado]="!estaAbierto(a)" [id]="'wxside-' + a.id">
          <ul>
            <li *ngFor="let d of destinosDe(a); trackBy: porRuta">
              <a class="wxside__item" [class.active]="esActivoDestino(d)"
                 [attr.aria-current]="esActivoDestino(d) ? 'page' : null"
                 [attr.tabindex]="estaAbierto(a) ? null : -1"
                 [routerLink]="d.ruta" [attr.title]="d.pie || null">
                <i class="ph {{ d.icono }}" aria-hidden="true"></i>
                <span>{{ d.texto }}</span>
              </a>
            </li>
          </ul>
        </div>
      </ng-template>
    </li>

    <!-- ------------------------------------------------------------ crear (despues de las areas, como en el dock) -->
    <li class="wxside__area" *ngIf="crear().length" [class.is-open]="crearAbierto()">
      <button type="button" class="wxside__link" data-guide="crear" (click)="crearAbierto.set(!crearAbierto())"
              [attr.aria-expanded]="crearAbierto()" aria-controls="wxside-crear" [attr.title]="plegada() ? 'Crear' : null">
        <i class="ph ph-plus-circle" aria-hidden="true"></i>
        <span class="wxside__txt">Crear</span>
        <i class="ph ph-caret-down wxside__chevron" aria-hidden="true"></i>
      </button>
      <div class="wx-abrir wxside__sub" [class.es-cerrado]="!crearAbierto()" id="wxside-crear">
        <ul>
          <li *ngFor="let d of crear(); trackBy: porRuta">
            <a class="wxside__item" [routerLink]="d.ruta" [attr.tabindex]="crearAbierto() ? null : -1" (click)="crearAbierto.set(false)">
              <i class="ph {{ d.icono }}" aria-hidden="true"></i><span>{{ d.texto }}</span>
            </a>
          </li>
        </ul>
      </div>
    </li>

    <!-- ------------------------------------------ mas: negocio y sistema -->
    <li class="wxside__area" *ngIf="acc.verApps">
      <button type="button" class="wxside__link" data-guide="nav-apps" (click)="abrirApps($event)"
              [attr.aria-expanded]="apps.abierta()" aria-haspopup="dialog"
              [attr.title]="plegada() ? 'Apps Wybix' : null" aria-label="Apps Wybix">
        <i class="ph ph-device-mobile" aria-hidden="true"></i><span class="wxside__txt">Apps Wybix</span>
      </button>
    </li>
    <li class="wxside__grp" *ngIf="negocio().length">
      <ul>
        <li *ngFor="let d of negocio(); trackBy: porRuta">
          <a class="wxside__link" [class.active]="esActivoDestino(d)"
             [attr.aria-current]="esActivoDestino(d) ? 'page' : null"
             [routerLink]="d.ruta" [attr.title]="plegada() ? d.texto : null">
            <i class="ph {{ d.icono }}" aria-hidden="true"></i>
            <span class="wxside__txt">{{ d.texto }}</span>
          </a>
        </li>
      </ul>
    </li>

    <li class="wxside__grp wxside__grp--sistema" *ngIf="sistema().length || acc.verAprobaciones">
      <ul>
        <!-- Aprobaciones: el mismo interruptor que en «Más» del dock. -->
        <li *ngIf="acc.verAprobaciones">
          <div class="wxside__aprob" data-guide="aprobaciones" [attr.data-guide-estado]="acc.aprobaciones()?.activas ? 'activas' : 'apagadas'">
            <button type="button" class="wxside__link" role="switch" [attr.aria-checked]="!!acc.aprobaciones()?.activas"
                    [disabled]="!acc.aprobaciones() || acc.aprobGuardando()" (click)="acc.pulsarAprobaciones()"
                    [attr.title]="plegada() ? 'Aprobaciones' : null">
              <i class="ph" [ngClass]="acc.aprobaciones()?.activas ? 'ph-shield-check' : 'ph-shield-slash'" aria-hidden="true"></i>
              <span class="wxside__txt">Aprobaciones</span>
              <span class="wxside__sw" [class.is-on]="acc.aprobaciones()?.activas" aria-hidden="true"><span></span></span>
            </button>
            <div class="wxside__aprobconfirma" *ngIf="acc.aprobConfirmar() && !plegada()" role="alert">
              <span>Quien vende hará retiros, egresos y devoluciones sin PIN.</span>
              <button type="button" (click)="acc.cancelarAprobaciones()">Cancelar</button>
              <button type="button" class="es-peligro" [disabled]="acc.aprobGuardando()" (click)="acc.pulsarAprobaciones()">Sí, apagar</button>
            </div>
            <p class="wxside__aproberror" *ngIf="acc.aprobError() && !plegada()" role="alert">{{ acc.aprobError() }}</p>
          </div>
        </li>
        <li *ngFor="let d of sistema(); trackBy: porRuta">
          <a class="wxside__link" [class.active]="esActivoDestino(d)"
             [attr.aria-current]="esActivoDestino(d) ? 'page' : null"
             [routerLink]="d.ruta" [attr.title]="plegada() ? d.texto : null">
            <i class="ph {{ d.icono }}" aria-hidden="true"></i>
            <span class="wxside__txt">{{ d.texto }}</span>
          </a>
        </li>
      </ul>
    </li>
  </ul>

  <!--
    EL PIE ES DE WYBIX.

    En el rail aqui iba el negocio; ahora el negocio vive en la cabecera de la
    aplicacion y no se repite. Lo que ocupa el pie es Wybix Mini, el mismo que
    en el dock: una sola figura por pantalla, con la variante de la sesion.
  -->
  <div class="wxside__pie">
    <span class="wxside__anclaWybix">
      <button type="button" class="wxside__pulso" data-guide="wybix-guide" (click)="alternarGuia($event)"
              [class.is-abierto]="guia.abierta()"
              [attr.aria-expanded]="guia.abierta()" aria-haspopup="dialog"
              [attr.aria-label]="estadoWybix() === 'atencion' ? 'Wybix: hay cosas pendientes' : 'Wybix: todo en orden'">
        <wx-mascota [estado]="estadoWybix()" [variante]="guia.variante()" [size]="30"></wx-mascota>
        <span *ngIf="estadoWybix() === 'atencion'" class="wxside__pulsopunto" aria-hidden="true"></span>
        <span class="wxside__wybix" *ngIf="!plegada()">
          <b>Wybix</b>
          <span>{{ estadoWybix() === 'atencion' ? 'Hay cosas pendientes' : 'Todo en orden' }}</span>
        </span>
      </button>
      <wx-guia></wx-guia>
    </span>
  </div>

  <!-- El tirador vive en el borde de la barra y se va con ella. -->
  <wx-nav-modo desde="sidebar" (cambiar)="usarDock.emit()"></wx-nav-modo>
</nav>
