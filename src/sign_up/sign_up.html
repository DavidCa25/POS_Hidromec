<div class="login-container">
  <div class="login-card">

    <img src="../assets/wybie_banner.png" alt="Logo"  style="width: 100%;" />

    <h2>Crear cuenta</h2>

    <form (submit)="onCrearCuenta($event)">
      <div class="input-group">
        <input
          type="text"
          placeholder="Nombre de usuario"
          [(ngModel)]="usuario"
          name="usuario"
          (input)="onInputChange()"
        />
      </div>

      <div class="input-group">
        <input
          [type]="mostrarContrasena ? 'text' : 'password'"
          placeholder="Contraseña"
          [(ngModel)]="contrasena"
          name="contrasena"
          (input)="onInputChange()"
        />
        <button type="button" class="toggle-btn" (click)="toggleMostrarContrasena()">
          <span [class]="mostrarContrasena ? 'icon-eye-off' : 'icon-eye'"></span>
        </button>
      </div>

      <div class="input-group">
        <input
          [type]="mostrarConfirmacion ? 'text' : 'password'"
          placeholder="Confirmar contraseña"
          [(ngModel)]="confirmarContrasena"
          name="confirmarContrasena"
          (input)="onInputChange()"
        />
       <button type="button" class="toggle-btn" (click)="toggleMostrarContrasena()">
          <span [class]="mostrarContrasena ? 'icon-eye-off' : 'icon-eye'"></span>
        </button>
      </div>

      <div class="input-group">
        <!-- Lista del dominio: control de Wybix, no del sistema operativo.
             Ver el contrato de interfaz en CLAUDE.md. -->
        <wx-select style="width:100%" [opciones]="opcRoles" placeholder="Elige un rol"
                   [(ngModel)]="rol" name="rol" (ngModelChange)="onInputChange()"></wx-select>
      </div>

      <div *ngIf="advertencia" class="warning-message">
        {{ advertencia }}
      </div>

      <div *ngIf="mensaje" class="error-message" [ngStyle]="{ 'background-color': mensaje.startsWith('✅') ? '#e0ffe4' : '#ffe0e0', 'color': mensaje.startsWith('✅') ? '#166534' : '#b00020' }">
        {{ mensaje }}
      </div>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Creando usuario...' : 'Crear cuenta' }}
      </button>
    </form>

    <div class="footer">
      ¿Ya tienes cuenta?
      <a href="javascript:void(0)" (click)="irALogin()">Inicia sesión aquí</a>
    </div>
  </div>
</div>
