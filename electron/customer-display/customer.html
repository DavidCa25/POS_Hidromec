<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla de cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1620; --bg2:#0f1f2b; --card:#12212e; --line:#22384880;
    --text:#eaf2f6; --muted:#8fa8b8; --brand:#45B3C3; --brand2:#7fd4e0;
    --ok:#34d399; --accent:#f8fafc;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #16233A 0%, var(--bg) 62%);
    color:var(--text); height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .screen{display:none; height:100vh; padding:4vh 5vw;}
  .screen.on{display:flex;}

  /* ===== ESPERA =====
     Es el rato en que la pantalla se mira sin que nadie la obligue: al entrar,
     mientras esperan turno, mientras cobran a otro. Si solo pone la hora, deja
     de mirarse. Si dice que hay algo que ganar, se mira. */
  #idle{flex-direction:column;align-items:center;justify-content:space-between;padding:5vh 5vw;}

  .idle-marca{display:flex;flex-direction:column;align-items:center;gap:1.6vh;}
  #idle .biz{font-size:2.6vw;font-weight:800;letter-spacing:-.01em;line-height:1.05;opacity:.92;}

  .idle-gancho{
    display:flex;flex-direction:column;align-items:center;gap:1.6vh;
    text-align:center;max-width:74vw;
  }
  .idle-kicker{
    font-size:1.3vw;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brand2);min-height:1.3vw;
  }
  .idle-titulo{
    font-size:4.6vw;font-weight:800;line-height:1.05;letter-spacing:-.02em;
    text-wrap:balance;margin:0;
  }
  .idle-sub{font-size:1.5vw;color:var(--muted);max-width:56ch;}

  .idle-premios{display:flex;flex-wrap:wrap;gap:1.2vh 1vw;justify-content:center;}
  .idle-premio{
    display:inline-flex;align-items:center;gap:.6vw;
    padding:1.2vh 1.8vw;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
    font-size:1.6vw;font-weight:700;color:var(--brand2);
  }
  .idle-premio::before{content:'★';opacity:.85;}

  .idle-pie{
    display:flex;align-items:center;gap:1.6vw;
    color:var(--muted);font-size:1.1vw;
  }
  #idle .clock{font-variant-numeric:tabular-nums;}
  .bizmsg{max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* La marca: logo del negocio o su inicial. */
  #idle .marca{
    width:110px;height:110px;border-radius:26px;display:grid;place-items:center;
    background:#fff;box-shadow:0 20px 60px rgba(9,16,24,.35);overflow:hidden;
  }
  #idle .marca img{width:100%;height:100%;object-fit:contain;padding:14px;}
  #idle .marca .inicial{font-size:52px;font-weight:800;color:var(--brand);line-height:1;}

  /* ===== VENTA ===== */
  #sale{flex-direction:column; gap:2vh;}
  #sale .head{display:flex; justify-content:space-between; align-items:baseline;}
  #sale .head .biz{font-size:2vw; font-weight:800;}
  /* Modo de servicio: el cliente ve si su pedido es para llevar. */
  #sale .head .modo{
    display:none; margin-left:.9vw; padding:.3vh 1vw; border-radius:999px;
    background:rgba(69,179,195,.16); color:var(--brand2);
    font-size:1vw; font-weight:600; vertical-align:middle;
  }
  #sale .head .modo.on{display:inline-block;}
  #sale .head .modo{
    display:none; margin-left:.9vw; padding:.3vh 1vw; border-radius:999px;
    background:rgba(69,179,195,.16); color:var(--brand2);
    font-size:1vw; font-weight:600; vertical-align:middle;
  }
  #sale .head .modo.on{display:inline-block;}
  #sale .head .clock{font-size:1.1vw; color:var(--muted); font-variant-numeric:tabular-nums;}
  .list{flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .list .row.h{color:var(--muted); font-size:1vw; font-weight:600; border-bottom:1px solid var(--line); padding-bottom:1.2vh;}
  .list .items{flex:1; overflow-y:auto;}
  .row{display:grid; grid-template-columns: 1fr 90px 150px 190px; align-items:center; gap:12px; padding:1.4vh 0;}
  .row.line{border-bottom:1px solid #1b2c3a; font-size:1.5vw;}
  .row .name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .opts{display:block; margin-top:.3vh; color:var(--brand2); font-size:.95vw; font-weight:500;}
  .row .qty{text-align:center; color:var(--muted);}
  .row .pu{text-align:right; color:var(--muted); font-size:1.2vw;}
  .row .imp{text-align:right; font-weight:700; font-variant-numeric:tabular-nums;}
  .totals{border-top:2px solid var(--line); padding-top:2vh; display:flex; flex-direction:column; gap:1vh;}
  .totline{display:flex; justify-content:space-between; font-size:1.4vw; color:var(--muted);}
  .totline b{color:var(--text);}
  .totline.grand{font-size:3vw; color:var(--text); font-weight:800; margin-top:.5vh;}
  .totline.grand .amt{color:var(--brand2);}

  /* ===== CIERRE ===== */
  #checkout{flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1.8vh;}
  #checkout .label{font-size:1.6vw; color:var(--muted); letter-spacing:2px; text-transform:uppercase;}
  #checkout .total{font-size:7vw; font-weight:800; color:var(--brand2); line-height:1; font-variant-numeric:tabular-nums;}
  #checkout .pays{display:flex; gap:5vw; margin-top:2vh;}
  #checkout .pay .k{font-size:1.2vw; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  #checkout .pay .v{font-size:2.6vw; font-weight:700; font-variant-numeric:tabular-nums;}
  #checkout .change .v{color:var(--ok);}
  #checkout .thanks{
    margin-top:3vh; font-size:2.6vw; font-weight:800;
    background:linear-gradient(90deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #checkout .thanks-sub{font-size:1.2vw; color:var(--muted);}

  /* Discreto y al pie: quien fabrica el POS, no quien vende. */
  .porwybix{
    position:fixed;right:2vw;bottom:1.6vh;
    font-size:.85vw;color:var(--muted);opacity:.45;letter-spacing:.04em;
  }

  /* ===== MODO VISTA PREVIA =====
     Un chip pequeno, arriba a la derecha. Tiene que quedar claro para quien
     administra, pero la pantalla debe seguir pareciendose a la de verdad: si
     la vista previa se ve distinta, deja de servir para comprobar como se
     vera. La garantia de que no se entrega nada es del backend, no de una
     banda naranja. */
  .previewbadge{
    position:fixed;right:1.2vw;top:1.2vh;z-index:100;
    display:none;align-items:center;gap:.5vw;
    padding:.6vh 1vw;border-radius:999px;
    background:rgba(180,83,9,.22);border:1px solid rgba(245,158,11,.5);
    color:#fcd34d;font-size:.95vw;font-weight:700;letter-spacing:.04em;
  }
  body.es-preview .previewbadge{display:flex;}

  /* ===== LA DINAMICA =====
     Poca cosa en pantalla y muy grande: el cliente la mira de pie, a dos
     metros, mientras alguien le cobra. Todo lo que no sea el reto, el premio
     y el boton estorba. */
  #juego{align-items:center;justify-content:center;}
  .jg{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.2vh;text-align:center;width:100%;
  }

  .jg-reto{
    font-size:2.4vw;font-weight:800;line-height:1.15;letter-spacing:-.01em;
    max-width:70vw;text-wrap:balance;
  }

  /* El numero que hay que clavar. Es el protagonista antes de empezar. */
  .jg-objetivo{
    display:none;
    font-size:9vw;font-weight:800;line-height:1;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,var(--brand2),var(--brand));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .jg--objetivo .jg-objetivo{display:block;}

  /* Los premios, en fichas. Se leen antes de jugar, que es cuando importan. */
  .jg-premios{display:none;flex-wrap:wrap;gap:1vh 1vw;justify-content:center;max-width:74vw;}
  .jg--premios .jg-premios{display:flex;}
  .jg-premio{
    display:inline-flex;align-items:center;gap:.6vw;
    padding:1.1vh 1.6vw;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
    font-size:1.5vw;font-weight:700;color:var(--brand2);
  }
  .jg-premio::before{content:'★';opacity:.8;}

  /* ------------------------------------------------------- cronometro */
  .jg-crono{
    display:none;
    font-size:15vw;font-weight:800;line-height:1;letter-spacing:-.05em;
    font-variant-numeric:tabular-nums;color:var(--accent);
    text-shadow:0 0 60px rgba(127,212,224,.25);
  }
  .jg--crono .jg-crono{display:block;}

  /* ------------------------------------------------------------ rueda */
  .jg-rueda{display:none;position:relative;width:min(46vh,46vw);aspect-ratio:1;}
  .jg--rueda .jg-rueda{display:block;}

  .jg-rueda__aguja{
    position:absolute;top:-1.4vh;left:50%;transform:translateX(-50%);
    width:0;height:0;z-index:3;
    border-left:1.4vh solid transparent;
    border-right:1.4vh solid transparent;
    border-top:2.6vh solid #ef4444;
    filter:drop-shadow(0 .4vh .6vh rgba(0,0,0,.5));
  }
  .jg-rueda__disco{
    position:absolute;inset:0;border-radius:50%;
    /* Aro exterior grueso y sombra profunda: parece una rueda, no un grafico. */
    border:.9vh solid #0e1c28;
    box-shadow:0 0 0 .5vh rgba(127,212,224,.35),
               0 2.4vh 5vh rgba(0,0,0,.5),
               inset 0 0 6vh rgba(0,0,0,.35);
    /* Arranca despacio, acelera y frena largo: asi se siente un giro de
       verdad. Lineal parece un GIF. */
    transition:transform 5.2s cubic-bezier(.17,.67,.16,1);
  }
  .jg-rueda__centro{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:22%;aspect-ratio:1;border-radius:50%;z-index:2;
    background:radial-gradient(circle at 35% 30%, #fff, #d7e6ee 60%, #b9cdd8);
    box-shadow:0 .6vh 1.4vh rgba(0,0,0,.45), inset 0 -.4vh .8vh rgba(0,0,0,.12);
  }
  /* Las etiquetas van HORIZONTALES dentro de cada sector: un texto girado 90
     grados no se lee de pie y a dos metros. */
  /* Cada etiqueta ocupa TODO el disco y se gira entera; el texto se coloca
     cerca del borde y se desgira para quedar horizontal.

     Antes se posicionaba con `translate(0,-32%)`, que es relativo al tamano
     del propio texto y no al radio: con etiquetas cortas apenas se movia y
     todas acababan amontonadas en el centro. */
  .jg-rueda__et{
    position:absolute;inset:0;pointer-events:none;
  }
  .jg-rueda__et span{
    position:absolute;top:7%;left:50%;
    display:block;max-width:11ch;
    font-weight:800;line-height:1.05;color:#0b1620;
    text-shadow:0 1px 2px rgba(255,255,255,.35);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
  }

  /* ------------------------------------------------------- el boton --
     Redondo, rojo y con relieve. Tiene que pedir que lo pulsen desde el otro
     lado del mostrador. */
  .jg-boton{
    display:none;position:relative;
    width:min(26vh,26vw);aspect-ratio:1;border-radius:50%;
    border:0;padding:0;cursor:pointer;
    background:radial-gradient(circle at 50% 32%, #ff6b6b, #e11d2f 58%, #9f0d1c);
    box-shadow:
      0 1.6vh 0 #6d0a14,                 /* el cuerpo del boton */
      0 2.6vh 4vh rgba(0,0,0,.55),       /* sombra sobre el fondo */
      inset 0 -.8vh 2vh rgba(0,0,0,.35),
      inset 0 .8vh 2vh rgba(255,255,255,.28);
    transition:transform 90ms ease-out, box-shadow 90ms ease-out;
  }
  .jg--boton .jg-boton{display:block;}
  .jg-boton:hover{transform:translateY(-.3vh);}
  /* Al pulsar se HUNDE: el cuerpo se acorta y el boton baja con el. */
  .jg-boton:active{
    transform:translateY(1.3vh);
    box-shadow:
      0 .3vh 0 #6d0a14,
      0 .6vh 1.2vh rgba(0,0,0,.5),
      inset 0 -.4vh 1.4vh rgba(0,0,0,.4),
      inset 0 .4vh 1.4vh rgba(255,255,255,.22);
  }
  .jg-boton:disabled{filter:saturate(.5) brightness(.7);cursor:default;}
  .jg-boton__cara{
    position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:2.6vw;font-weight:800;letter-spacing:.06em;
    text-shadow:0 .3vh .6vh rgba(0,0,0,.45);
  }
  /* Late suavemente mientras se puede pulsar: llama sin gritar. */
  @keyframes jg-latido{50%{box-shadow:
      0 1.6vh 0 #6d0a14,
      0 2.6vh 4vh rgba(0,0,0,.55),
      0 0 0 2.2vh rgba(225,29,47,.14),
      inset 0 -.8vh 2vh rgba(0,0,0,.35),
      inset 0 .8vh 2vh rgba(255,255,255,.28);}}
  .jg-boton.late{animation:jg-latido 1.8s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){
    .jg-boton.late{animation:none;}
    .jg-rueda__disco{transition:transform 600ms ease-out;}
  }

  .jg-pie{font-size:1.2vw;color:var(--muted);max-width:60vw;}

  /* ------------------------------------------------------- resultado */
  .jg--gano .jg-reto{color:var(--ok);font-size:5.5vw;}
  .jg--pierde .jg-reto{font-size:4.5vw;}
  .jg-codigo{
    display:none;padding:1.2vh 2vw;border-radius:14px;
    background:var(--card);border:1px solid var(--line);
    font-size:2vw;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;
  }
  .jg--codigo .jg-codigo{display:block;}

  /* Confeti: unas cuantas piezas cayendo. Nada de librerias. */
  .jg-confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;display:none;z-index:40;}
  .jg--fiesta .jg-confeti{display:block;}
  .jg-confeti i{
    position:absolute;top:-6vh;width:.8vw;height:1.4vh;opacity:.9;
    animation:jg-caer linear forwards;
  }
  @keyframes jg-caer{
    to{transform:translateY(110vh) rotate(720deg);opacity:.15;}
  }
  @media (prefers-reduced-motion: reduce){ .jg-confeti{display:none !important;} }


  /* ===== FIDELIZACION ===== */
  /* Tres pantallas mas, con el mismo lenguaje que las tres que ya habia:
     una cifra grande, una linea que la explica, y nada mas que leer. */
  #premios,#dinamica,#dinres{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh;}

  #premios .kicker{font-size:1.6vw;color:var(--brand2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  #premios .title{font-size:3.6vw;font-weight:800;letter-spacing:-.5px;}
  #premios .list{display:flex;flex-direction:column;gap:1.4vh;margin-top:1vh;width:min(70vw,900px);}
  #premios .item{
    display:flex;align-items:center;gap:1.4vw;padding:2vh 2vw;
    background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:left;
  }
  #premios .item .ic{font-size:2.6vw;line-height:1;}
  #premios .item .tx{flex:1;min-width:0;}
  #premios .item .n{font-size:1.9vw;font-weight:700;}
  /* El codigo es lo unico que el cliente tiene que apuntar: va aparte. */
  #premios .item .c{font-size:1.4vw;color:var(--brand2);font-variant-numeric:tabular-nums;letter-spacing:.06em;}
  #premios .item .k{font-size:1.1vw;color:var(--muted);}

  #dinamica .name{font-size:2.6vw;font-weight:800;}
  #dinamica .instr{font-size:1.5vw;color:var(--muted);max-width:60vw;}
  #dinamica .crono{
    font-size:13vw;font-weight:800;line-height:1;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;color:var(--brand2);
  }
  #dinamica .crono.parado{color:var(--accent);}
  #dinamica .meta{font-size:1.4vw;color:var(--muted);}

  #dinres .big{font-size:6vw;font-weight:800;letter-spacing:-1px;}
  #dinres .big.ok{color:var(--ok);}
  #dinres .msg{font-size:2.2vw;color:var(--text);max-width:60vw;}
  #dinres .premio{font-size:1.8vw;color:var(--brand2);font-weight:700;}
  #dinres .code{
    margin-top:1vh;padding:1.2vh 2vw;background:var(--card);border:1px solid var(--line);
    border-radius:14px;font-size:2vw;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>

  <!-- ESPERA -->
  <section class="screen on" id="idle">
    <!--
      La identidad la pone el NEGOCIO, no el POS. `marca` lleva su logo si lo
      subio, y si no su inicial. Sustituirle la marca al comercio en su propio
      mostrador es el mismo error que imprimir la marca de otro en el ticket.
    -->
    <div class="idle-marca">
      <div class="marca" id="idleMarca">
        <span class="inicial" id="idleInicial"></span>
      </div>
      <div class="biz" id="idleBiz">Bienvenido</div>
    </div>

    <!--
      El gancho. Cambia segun lo que el negocio tenga encendido: si hay algo
      que ganar, lo dice; si no, saluda. Una pantalla que siempre pone lo
      mismo deja de mirarse a la semana.
    -->
    <div class="idle-gancho">
      <p class="idle-kicker" id="idleKicker"></p>
      <h2 class="idle-titulo" id="idleTitulo">Bienvenido</h2>
      <div class="idle-premios" id="idlePremios"></div>
      <p class="idle-sub" id="idleSub"></p>
    </div>

    <div class="idle-pie">
      <span class="clock" id="idleClock"></span>
      <span class="bizmsg" id="idleMensaje"></span>
    </div>
  </section>

  <!-- ============================================ LA DINAMICA =========
       Esta pantalla ES la experiencia. No es un espejo del administrador ni
       un panel de estado: es lo que mira el cliente mientras juega, y lo
       unico de Wybix que ve alguien que no trabaja aqui.
       ================================================================= -->
  <section class="screen" id="juego">
    <div class="jg">
      <p class="jg-reto" id="jgReto"></p>

      <!-- El objetivo, enorme. Es el numero que hay que clavar. -->
      <div class="jg-objetivo" id="jgObjetivo"></div>

      <!-- El premio va ANTES de jugar: es la razon para jugar. -->
      <div class="jg-premios" id="jgPremios"></div>

      <!-- ---------------------------------------------------- RULETA -->
      <div class="jg-rueda" id="jgRueda">
        <span class="jg-rueda__aguja" aria-hidden="true"></span>
        <div class="jg-rueda__disco" id="jgDisco"></div>
        <div class="jg-rueda__centro" id="jgCentro"></div>
      </div>

      <!-- ------------------------------------------------ CRONOMETRO -->
      <div class="jg-crono" id="jgCrono"></div>

      <!-- ------------------------------------------------ EL BOTON --
           Grande, redondo y con relieve: tiene que pedir que lo pulsen
           desde el otro lado del mostrador. -->
      <button type="button" class="jg-boton" id="jgBoton">
        <span class="jg-boton__cara" id="jgBotonTxt">COMENZAR</span>
      </button>

      <div class="jg-codigo" id="jgCodigo"></div>
      <p class="jg-pie" id="jgPie"></p>
    </div>
  </section>

  <div class="jg-confeti" id="jgConfeti" aria-hidden="true"></div>

  <div class="previewbadge"><span aria-hidden="true">●</span> Vista previa</div>

  <div class="porwybix">Powered by Wybix</div>

  <!-- VENTA -->
  <section class="screen" id="sale">
    <div class="head">
      <!--
        El nombre y el modo de servicio van en elementos SEPARADOS.
        Estaban anidados, y `loadBusiness` escribia `saleBiz.textContent`, lo
        que borraba el <span> del modo: a partir de ahi `renderSale` no lo
        encontraba y lanzaba, asi que la pantalla del cliente NUNCA llegaba a
        pintar el carrito.
      -->
      <div class="biz"><span id="saleBiz">Tu compra</span><span class="modo" id="saleModo"></span></div>
      <div class="clock" id="saleClock"></div>
    </div>
    <div class="list">
      <div class="row h"><div>Producto</div><div style="text-align:center;">Cant.</div><div style="text-align:right;">P. unit.</div><div style="text-align:right;">Importe</div></div>
      <div class="items" id="saleItems"></div>
    </div>
    <div class="totals">
      <div class="totline" id="rowSubtotal"><span>Subtotal</span><b class="amt"></b></div>
      <div class="totline" id="rowTax"><span>IVA</span><b class="amt"></b></div>
      <div class="totline" id="rowDiscount" style="display:none;"><span>Descuento</span><b class="amt"></b></div>
      <div class="totline grand"><span>TOTAL</span><span class="amt">$0.00</span></div>
    </div>
  </section>

  <!-- CIERRE -->
  <section class="screen" id="checkout">
    <div class="label">Total a pagar</div>
    <div class="total" id="coTotal">$0.00</div>
    <div class="pays">
      <div class="pay" id="coPaidBox">
        <div class="k" id="coPaidLabel">Pago recibido</div>
        <div class="v" id="coPaid">$0.00</div>
      </div>
      <div class="pay change" id="coChangeBox">
        <div class="k">Cambio</div>
        <div class="v" id="coChange">$0.00</div>
      </div>
    </div>
    <div class="thanks">¡Gracias por su compra!</div>
    <div class="thanks-sub">Vuelva pronto</div>
  </section>

  <section class="screen" id="premios">
    <div class="kicker">Tu compra tiene premio</div>
    <div class="title" id="prTitle">¡Felicidades!</div>
    <div class="list" id="prList"></div>
  </section>

  <section class="screen" id="dinres">
    <div class="big" id="drBig"></div>
    <div class="msg" id="drMsg"></div>
    <div class="premio" id="drPremio"></div>
    <div class="code" id="drCode" style="display:none"></div>
  </section>

<script>
  const api = window.customerAPI;
  let bizName = '';

  /*
   * Vista previa.
   *
   * La ventana se abre con `?preview=1`. Es lo UNICO que la distingue: el
   * resto de la pagina es identica, porque si cambiara dejaria de servir para
   * comprobar como se vera de verdad.
   */
  const esPreview = new URLSearchParams(location.search).get('preview') === '1';
  if (esPreview) document.body.classList.add('es-preview');
  let checkoutTimer = null;

  function money(n){
    const v = Number(n || 0);
    return '$' + v.toLocaleString('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function show(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  }

  // Reloj
  function tick(){
    const d = new Date();
    const fecha = d.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
    const hora = d.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
    const txt = fecha.charAt(0).toUpperCase() + fecha.slice(1) + ' · ' + hora;
    const a = document.getElementById('idleClock'); if (a) a.textContent = txt;
    const b = document.getElementById('saleClock'); if (b) b.textContent = hora;
  }
  setInterval(tick, 1000); tick();

  /**
   * Identidad del negocio: nombre, logo y mensaje.
   *
   * Si hay logo, se pinta. Si no, la inicial del negocio sobre placa clara.
   * Nunca el isotipo del POS: la anterior version ponia `wybie_logo.png` fijo
   * y ademas escribia la inicial con `.textContent` sobre un `<img>`, que no
   * renderiza nada; el negocio jamas vio su identidad, viera lo que viera.
   */
  async function loadBusiness(){
    try {
      const b = await api.getBusiness();
      bizName = (b && b.name) ? String(b.name).trim() : '';
      const marca = document.getElementById('idleMarca');
      const inicial = document.getElementById('idleInicial');

      if (bizName) {
        document.getElementById('idleBiz').textContent = bizName;
        document.getElementById('saleBiz').textContent = bizName;
      }
      // El mensaje del negocio (pie del ticket) cuando lo tenga configurado.
      const msg = document.getElementById('idleMensaje');
      if (msg) msg.textContent = (b && b.mensaje) ? String(b.mensaje) : '';

      pintarGancho(b || {});

      if (b && b.logoUrl) {
        const img = document.createElement('img');
        img.alt = bizName || 'Logo del negocio';
        // Si el archivo esta corrupto o desaparecio, se cae al monograma en
        // vez de dejar el icono de imagen rota delante del cliente.
        img.onerror = function(){ marca.innerHTML = ''; marca.appendChild(inicial); };
        img.src = b.logoUrl;
        marca.innerHTML = '';
        marca.appendChild(img);
      } else {
        inicial.textContent = bizName ? bizName.charAt(0).toUpperCase() : '';
      }
    } catch { /* sin datos: queda el monograma vacio, nunca marca ajena */ }
  }
  /**
   * El gancho de la pantalla de espera.
   *
   * Se ELIGE segun lo que el negocio tenga encendido, no se escribe fijo. Una
   * frase de cortesia -"con gusto te atendemos"- no da ningun motivo para
   * mirar la segunda pantalla; "hoy puedes ganar un cafe" si.
   *
   * Sin nada activo se cae en una bienvenida, que sigue siendo mejor que una
   * pantalla vacia. El fallback es lo de siempre, no lo de portada.
   */
  function pintarGancho(b) {
    const kicker = document.getElementById('idleKicker');
    const titulo = document.getElementById('idleTitulo');
    const sub = document.getElementById('idleSub');
    const prem = document.getElementById('idlePremios');
    if (!titulo) return;

    const premios = Array.isArray(b.premios) ? b.premios.filter(Boolean) : [];
    prem.innerHTML = '';

    if (premios.length) {
      kicker.textContent = 'Tu compra puede tener premio';
      titulo.textContent = premios.length > 1 ? 'Hoy puedes ganar' : 'Hoy puedes ganar';
      premios.slice(0, 4).forEach(function (p) {
        const d = document.createElement('span');
        d.className = 'idle-premio';
        d.textContent = p;
        prem.appendChild(d);
      });
      sub.textContent = 'Pregunta en caja cómo participar.';
      return;
    }

    if (b.campana) {
      kicker.textContent = 'Promoción activa';
      titulo.textContent = b.campana;
      sub.textContent = 'Pregunta en caja cómo participar.';
      return;
    }

    kicker.textContent = '';
    titulo.textContent = bizName ? ('Bienvenido a ' + bizName) : 'Bienvenido';
    sub.textContent = 'Con gusto te atendemos.';
  }

  loadBusiness();

  function renderSale(s){
    const cont = document.getElementById('saleItems');
    cont.innerHTML = '';
    (s.items || []).forEach(it => {
      const row = document.createElement('div');
      row.className = 'row line';
      row.innerHTML =
        '<div class="name">' + escapeHtml(it.name) +
          (it.options ? '<span class="opts">' + escapeHtml(it.options) + '</span>' : '') +
        '</div>' +
        '<div class="qty">' + it.qty + '</div>' +
        '<div class="pu">' + money(it.unitPrice) + '</div>' +
        '<div class="imp">' + money(it.importe) + '</div>';
      cont.appendChild(row);
    });
    cont.scrollTop = cont.scrollHeight;

    const modo = document.getElementById('saleModo');
    if (modo) {
      if (s.serviceMode === 'TAKEAWAY') { modo.textContent = 'Para llevar'; modo.classList.add('on'); }
      else if (s.serviceMode === 'DINE_IN') { modo.textContent = 'Para consumir aquí'; modo.classList.add('on'); }
      else { modo.classList.remove('on'); }
    }

    document.querySelector('#rowSubtotal .amt').textContent = money(s.subtotal);
    document.querySelector('#rowTax .amt').textContent = money(s.tax);
    const disc = document.getElementById('rowDiscount');
    if (Number(s.discount) > 0) { disc.style.display = 'flex'; disc.querySelector('.amt').textContent = '-' + money(s.discount); }
    else { disc.style.display = 'none'; }
    document.querySelector('.totline.grand .amt').textContent = money(s.total);
  }

  function renderCheckout(s){
    document.getElementById('coTotal').textContent = money(s.total);
    const paidBox = document.getElementById('coPaidBox');
    const changeBox = document.getElementById('coChangeBox');
    if (s.credito) {
      document.getElementById('coPaidLabel').textContent = 'Venta a crédito';
      document.getElementById('coPaid').textContent = 'Por cobrar';
      changeBox.style.display = 'none';
      paidBox.style.display = 'block';
    } else {
      const method = ({EFECTIVO:'Pago en efectivo',TARJETA:'Pago con tarjeta',TRANSFERENCIA:'Transferencia',TERMINAL_MP:'Terminal'})[s.method] || 'Pago recibido';
      document.getElementById('coPaidLabel').textContent = method;
      document.getElementById('coPaid').textContent = money(s.paid);
      paidBox.style.display = 'block';
      if (s.method === 'EFECTIVO' && Number(s.change) >= 0) {
        changeBox.style.display = 'block';
        document.getElementById('coChange').textContent = money(s.change);
      } else {
        changeBox.style.display = 'none';
      }
    }
  }

  // ------------------------------------------------------ Fidelizacion
  // Los iconos van como entidades HTML y no como texto: este archivo lo
  // tocan scripts de generacion, y un emoji fuera del BMP es justo lo que
  // se rompe al pasar por una herramienta que no cuida la codificacion.
  const ICONO_PREMIO = {
    REWARD: '&#127873;', COUPON: '&#127915;',
    DYNAMIC: '&#127918;', RAFFLE_ENTRY: '&#127903;',
  };
  const NOMBRE_PREMIO = {
    REWARD: 'Recompensa', COUPON: 'Cupón para tu próxima visita',
    DYNAMIC: 'Tienes una dinámica por jugar', RAFFLE_ENTRY: 'Boleto de rifa',
  };

  function renderPremios(s){
    const cont = document.getElementById('prList');
    cont.innerHTML = '';
    (s.items || []).forEach(function(it){
      const div = document.createElement('div');
      div.className = 'item';
      div.dataset.origen = it.tipo || '';
      // El codigo es lo unico que el cliente necesita apuntar: va en su
      // propia linea, no escondido dentro de la descripcion.
      const codigo = it.codigo ? it.codigo
        : (it.numero != null ? ('Boleto ' + it.numero) : '');
      div.innerHTML =
        '<div class="ic">' + (ICONO_PREMIO[it.tipo] || '&#11088;') + '</div>' +
        '<div class="tx">' +
          '<div class="n">' + escapeHtml(it.nombre || NOMBRE_PREMIO[it.tipo] || 'Premio') + '</div>' +
          (codigo ? '<div class="c">' + escapeHtml(codigo) + '</div>' : '') +
          '<div class="k">' + escapeHtml(NOMBRE_PREMIO[it.tipo] || '') + '</div>' +
        '</div>';
      cont.appendChild(div);
    });
    document.getElementById('prTitle').textContent =
      (s.items || []).length > 1 ? '¡Ganaste varios premios!' : '¡Felicidades!';
  }

  function renderResultado(s){
    const big = document.getElementById('drBig');
    // El origen queda en el DOM: quien mire esta pantalla -o una captura de
    // ella- puede saber de donde salio el premio sin interpretar el texto.
    document.getElementById('dinres').dataset.origen = s.origen || 'DYNAMIC';
    big.textContent = s.gano ? '¡Ganaste!' : 'Casi';
    big.classList.toggle('ok', !!s.gano);
    document.getElementById('drMsg').textContent = s.mensaje || '';
    document.getElementById('drPremio').textContent = s.premio || '';
    const code = document.getElementById('drCode');
    if (s.codigo) { code.style.display = 'block'; code.textContent = s.codigo; }
    else { code.style.display = 'none'; }
  }

  /* =================================================== LA DINAMICA ====
     Esta pantalla ES la experiencia del cliente: presenta, anima y recoge lo
     que el cliente pulsa. NO decide nada.

     El cronometro corre AQUI porque aqui esta el boton y aqui se mira el
     numero. Lo que viaja de vuelta es la intencion -STOP_TIMING con las
     centesimas que se estaban mostrando-, nunca "he ganado".

     La accion se separa de su origen a proposito: hoy es un boton en una
     pantalla tactil, y manana podria ser un pulsador fisico en la pared. El
     evento seria el mismo.
     ==================================================================== */
  var jgEstado = null;
  var jgT0 = 0;
  var jgRaf = null;
  var jgCentesimas = 0;

  /* Colores de los sectores. Contrastados entre si y legibles con texto
     oscuro encima: la rueda tiene que leerse de un vistazo. */
  var JG_COLORES = [
    '#45B3C3', '#F4B740', '#7FD4E0', '#EF7D57',
    '#9BD17B', '#C792EA', '#FFD166', '#5EC5D6'
  ];

  function jgClase(mods) {
    var jg = document.querySelector('#juego .jg');
    if (!jg) return;
    jg.className = 'jg' + (mods.length ? ' ' + mods.map(function (m) { return 'jg--' + m; }).join(' ') : '');
  }

  function jgBoton(texto, visible, habilitado, late) {
    var b = document.getElementById('jgBoton');
    var t = document.getElementById('jgBotonTxt');
    if (!b || !t) return;
    t.textContent = texto || '';
    b.disabled = !habilitado;
    b.classList.toggle('late', !!late);
  }

  function jgPremios(lista) {
    var c = document.getElementById('jgPremios');
    if (!c) return;
    c.innerHTML = '';
    (lista || []).forEach(function (p) {
      var d = document.createElement('span');
      d.className = 'jg-premio';
      d.textContent = p;
      c.appendChild(d);
    });
  }

  /** Dibuja la rueda: sectores, aro y etiquetas horizontales. */
  function jgDibujarRueda(sectores) {
    var disco = document.getElementById('jgDisco');
    if (!disco) return;
    var n = (sectores || []).length;
    if (!n) { disco.style.background = 'var(--card)'; disco.innerHTML = ''; return; }

    var paso = 360 / n;
    var tramos = sectores.map(function (_, i) {
      var c = JG_COLORES[i % JG_COLORES.length];
      return c + ' ' + (i * paso) + 'deg ' + ((i + 1) * paso) + 'deg';
    });
    disco.style.background = 'conic-gradient(' + tramos.join(',') + ')';

    /* Las etiquetas se colocan girando el CONTENEDOR y desgirando el texto:
       asi caen dentro de su sector pero se leen horizontales. Un texto a 90
       grados no se lee de pie y a dos metros. */
    disco.innerHTML = '';
    var fuente = n <= 5 ? 1.5 : n <= 8 ? 1.15 : 0.95;   // vw
    sectores.forEach(function (label, i) {
      var ang = paso * i + paso / 2;
      var et = document.createElement('div');
      et.className = 'jg-rueda__et';
      et.style.transform = 'rotate(' + ang + 'deg)';
      var sp = document.createElement('span');
      // Se desgira lo mismo que se giro el contenedor: el texto queda
      // horizontal aunque su sector este boca abajo.
      sp.style.transform = 'translateX(-50%) rotate(' + (-ang) + 'deg)';
      sp.style.fontSize = fuente + 'vw';
      sp.textContent = label;
      et.appendChild(sp);
      disco.appendChild(et);
    });
  }

  function jgConfeti() {
    var c = document.getElementById('jgConfeti');
    if (!c) return;
    c.innerHTML = '';
    for (var i = 0; i < 70; i++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.background = JG_COLORES[i % JG_COLORES.length];
      p.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
      p.style.animationDelay = (Math.random() * 0.7) + 's';
      c.appendChild(p);
    }
  }

  function jgPararReloj() {
    if (jgRaf) { cancelAnimationFrame(jgRaf); jgRaf = null; }
  }

  /* Centesimas ENTERAS: de este mismo entero salen el numero que se pinta y
     el que se manda. Contar en segundos y redondear dos veces es como la
     pantalla acaba diciendo 10.00 y el servidor juzgando 9.99. */
  function jgTic() {
    jgCentesimas = Math.round((performance.now() - jgT0) / 10);
    var e = document.getElementById('jgCrono');
    if (e) e.textContent = (jgCentesimas / 100).toFixed(2);
    jgRaf = requestAnimationFrame(jgTic);
  }

  function jgPulsar() {
    if (!jgEstado) return;
    var f = jgEstado.fase;

    if (f === 'LISTA') {
      if (jgEstado.tipo === 'TIMING') {
        // Empieza AQUI: el cronometro vive donde esta el boton.
        jgCentesimas = 0;
        jgT0 = performance.now();
        jgPararReloj();
        jgTic();
        jgEstado.fase = 'JUGANDO';
        jgPintar(jgEstado);
        api.enviar({ tipo: 'START_TIMING' });
      } else {
        jgBoton('GIRANDO…', true, false, false);
        api.enviar({ tipo: 'SPIN' });
      }
      return;
    }

    if (f === 'JUGANDO' && jgEstado.tipo === 'TIMING') {
      jgPararReloj();
      jgBoton('…', true, false, false);
      // Lo que viaja es CUANDO paro, no si gano.
      api.enviar({ tipo: 'STOP_TIMING', centesimas: jgCentesimas });
    }
  }

  function jgPintar(s) {
    jgEstado = s;
    var reto = document.getElementById('jgReto');
    var obj = document.getElementById('jgObjetivo');
    var pie = document.getElementById('jgPie');
    var cod = document.getElementById('jgCodigo');

    if (s.fase === 'LISTA') {
      jgPararReloj();
      reto.textContent = s.reto || s.nombre || '';
      if (s.tipo === 'TIMING') {
        obj.textContent = Number(s.objetivo || 0).toFixed(2);
        jgPremios(s.premios);
        jgClase(['objetivo', 'premios', 'boton']);
        jgBoton('COMENZAR', true, true, true);
      } else {
        jgDibujarRueda(s.sectores || []);
        jgPremios(s.premios);
        jgClase(['premios', 'rueda', 'boton']);
        jgBoton('GIRAR', true, true, true);
      }
      pie.textContent = '';
      return;
    }

    if (s.fase === 'JUGANDO') {
      // Durante el juego no hay nada mas que mirar: el numero y el boton.
      reto.textContent = s.reto || '';
      var e = document.getElementById('jgCrono');
      if (e) e.textContent = (jgCentesimas / 100).toFixed(2);
      jgClase(['crono', 'boton']);
      jgBoton('¡PARAR!', true, true, false);
      pie.textContent = '';
      return;
    }

    if (s.fase === 'GIRANDO') {
      var disco = document.getElementById('jgDisco');
      var n = (s.sectores || []).length || 1;
      var paso = 360 / n;
      var i = typeof s.ganadorIndice === 'number' ? s.ganadorIndice : 0;
      // Cinco vueltas y para donde ya se decidio. La animacion REPRESENTA el
      // resultado; no lo produce.
      var destino = 360 * 5 + (360 - (i * paso + paso / 2));
      jgClase(['rueda', 'boton']);
      jgBoton('GIRANDO…', true, false, false);
      reto.textContent = s.reto || '';
      if (disco) {
        var actual = Number(disco.dataset.giro || 0) + destino;
        disco.dataset.giro = actual;
        requestAnimationFrame(function () { disco.style.transform = 'rotate(' + actual + 'deg)'; });
      }
      return;
    }

    if (s.fase === 'RESULTADO') {
      jgPararReloj();
      reto.textContent = s.mensaje || (s.gano ? '¡GANASTE!' : 'CASI');
      jgPremios(s.premioGanado ? [s.premioGanado] : []);
      if (cod) cod.textContent = s.codigo || '';
      var mods = [s.gano ? 'gano' : 'pierde'];
      if (s.premioGanado) mods.push('premios');
      if (s.codigo) mods.push('codigo');
      if (s.gano) { mods.push('fiesta'); jgConfeti(); }
      if (s.tipo === 'WHEEL') mods.push('rueda');
      jgClase(mods);
      jgBoton('', false, false, false);
      pie.textContent = '';
    }
  }

  var jgBtn = document.getElementById('jgBoton');
  if (jgBtn) jgBtn.addEventListener('click', jgPulsar);


  function goIdle(){ show('idle'); }

  // Recibe estado del punto de venta
  api.onState((s) => {
    if (!s || !s.mode) return;
    if (s.mode === 'sale') {
      if (checkoutTimer) { clearTimeout(checkoutTimer); checkoutTimer = null; }
      if (!s.items || !s.items.length) { if (!checkoutTimer) goIdle(); return; }
      renderSale(s);
      show('sale');
    } else if (s.mode === 'checkout') {
      if (checkoutTimer) clearTimeout(checkoutTimer);
      renderCheckout(s);
      show('checkout');
      checkoutTimer = setTimeout(() => { checkoutTimer = null; goIdle(); }, 8000);
    } else if (s.mode === 'message') {
      document.getElementById('idleBiz').textContent = s.text || bizName;
      show('idle');
    } else if (s.mode === 'premios') {
      // Sustituye al "gracias" y dura mas: es lo que el cliente tiene que
      // leer y, si trae codigo, apuntar antes de irse.
      if (checkoutTimer) clearTimeout(checkoutTimer);
      renderPremios(s);
      show('premios');
      checkoutTimer = setTimeout(function(){ checkoutTimer = null; goIdle(); }, 12000);
    } else if (s.mode === 'dinamica') {
      // Sin temporizador mientras se juega: la pantalla no se va sola a media
      // partida. Solo el resultado pone cuenta atras.
      if (checkoutTimer) { clearTimeout(checkoutTimer); checkoutTimer = null; }
      jgPintar(s);
      show('juego');
      if (s.fase === 'RESULTADO') {
        checkoutTimer = setTimeout(function(){ checkoutTimer = null; goIdle(); }, 14000);
      }
    } else if (s.mode === 'dinamica-resultado') {
      if (checkoutTimer) clearTimeout(checkoutTimer);
      renderResultado(s);
      show('dinres');
      checkoutTimer = setTimeout(function(){ checkoutTimer = null; goIdle(); }, 12000);
    } else if (s.mode === 'idle') {
      if (checkoutTimer) return; // no interrumpir el "gracias"
      goIdle();
    }
  });

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
