<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ticket</title>
<!--
  TICKET DE VENTA - 58 / 80 mm
  ---------------------------------------------------------------------------
  Un ticket termico no es una pagina web estrecha. Manda la legibilidad a
  203 dpi sobre papel barato, en un local con prisa:

    - Sin bordes ni tramas. Una linea de puntos cuesta tinta y se ve sucia en
      termica; las separaciones son guiones o espacio en blanco.
    - Sin gris. La termica no tiene medios tonos: un #666 sale igual de negro
      que un #000, pero mas emborronado. Todo es negro, y la jerarquia se hace
      con TAMANO y NEGRITA.
    - Cifras en monoespaciada tabular y alineadas a la derecha. Es lo unico
      que permite comparar una columna de importes de un vistazo.
    - El ancho lo pone {{PAPER_W}}: la misma plantilla sirve para 58 y 80 mm,
      y en 58 el nombre del producto va en su propia linea porque no caben
      cuatro columnas.
  ---------------------------------------------------------------------------
-->
<style>
  @page { size: {{PAPER_W}}mm auto; margin: 0; }
  html, body { margin: 0; padding: 0; }

  body {
    width: {{PAPER_W}}mm;
    box-sizing: border-box;
    padding: 3mm 3mm 6mm;
    color: #000;
    font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.35;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .num { font-family: "Consolas", "DejaVu Sans Mono", "Courier New", monospace;
         font-variant-numeric: tabular-nums; }
  .r { text-align: right; }
  .c { text-align: center; }
  .b { font-weight: 700; }

  /* Separadores: guiones, no bordes. En termica un border-bottom fino se
     imprime irregular; una fila de guiones sale siempre igual. */
  .sep { margin: 5px 0; overflow: hidden; white-space: nowrap; letter-spacing: 1px; }
  .sep::after { content: "------------------------------------------------------------"; }

  /* ---- Cabecera ---- */
  .logo { display: block; max-width: 42mm; max-height: 20mm; margin: 0 auto 4px; }
  .negocio { font-size: 16px; font-weight: 700; text-align: center; line-height: 1.15; }
  .negocio-datos { text-align: center; font-size: 11px; margin-top: 2px; }

  /* ---- Datos de la venta: etiqueta a la izquierda, valor a la derecha ---- */
  .meta { margin-top: 2px; }
  .meta div { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
  .meta span:last-child { text-align: right; }
  .folio { font-size: 15px; font-weight: 700; }

  /* ---- Partidas ---- */
  table { width: 100%; border-collapse: collapse; }
  .items th {
    font-size: 10px; font-weight: 700; text-align: left;
    padding: 0 0 2px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .items td { padding: 1px 0 3px; vertical-align: top; font-size: 12px; }
  .items .nombre { font-weight: 600; }
  /* Cantidad x precio en su propia linea: cabe en 58 mm y se lee mejor que
     apretar cuatro columnas. */
  .items .detalle { font-size: 11px; }
  .items .importe { white-space: nowrap; }
  .items .extra { font-size: 10px; padding-left: 8px; }

  /* ---- Totales ---- */
  .tot div { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 1px 0; }
  .tot .grande { font-size: 17px; font-weight: 700; padding: 3px 0; }

  .pie { text-align: center; font-size: 11px; margin-top: 8px; line-height: 1.4; }
  .pie .gracias { font-weight: 700; }
</style>
</head>
<body>

  <!-- El logo solo si el negocio configuro uno. Antes iba fijo el de otro
       cliente, asi que cualquier negocio imprimia una marca ajena. -->
  {{LOGO_BLOCK}}

  <div class="negocio">{{BUSINESS_NAME}}</div>
  <div class="negocio-datos">{{BUSINESS_LINES}}</div>

  <div class="sep"></div>

  <div class="meta">
    <div><span class="b">Ticket</span><span class="folio num">{{FOLIO}}</span></div>
    <div><span>Fecha</span><span class="num">{{DATE}}</span></div>
    {{META_EXTRA}}
  </div>

  <div class="sep"></div>

  <table class="items">
    <thead>
      <tr><th>Producto</th><th class="r">Importe</th></tr>
    </thead>
    <tbody>
      {{ROWS}}
    </tbody>
  </table>

  <div class="sep"></div>

  <div class="tot">
    {{TOTALES}}
  </div>

  <div class="sep"></div>

  <div class="pie">{{FOOTER}}</div>

</body>
</html>
